<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Meanwhile">
  <!-- Leaving and coming back, and the span of time someone else holds in between.
       A wide, shallow arc rather than a peaked one: the first version read as a
       croquet hoop. Two dots and one stroke, so it survives favicon size. -->
  <path d="M9 31.5 Q24 6.5 39 31.5" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <circle cx="9" cy="31.5" r="4.75" fill="currentColor"/>
  <circle cx="39" cy="31.5" r="4.75" fill="currentColor"/>
</svg>
