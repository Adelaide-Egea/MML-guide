<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Carnet">
  <!-- The cover of a bound notebook, with a ribbon marking the page someone was
       left on. Two shapes only, so it survives being rendered at 16px in a
       browser tab and at 1024px on a store listing. -->
